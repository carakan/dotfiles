# install.conf.yaml — dotbot config-driven dotfile linkage.
# COMMON (cross-platform) links only. Platform-specific links live in
# install-darwin.yaml / install-linux.yaml, chosen by ./install via uname.
# Packages: single source of truth for per-tool configs, symlinked by dotbot.

- clean: ['~']

- defaults:
    link:
      create: true

- link:
    # ── shell (aliases / zsh; bashrc is cross-platform, bash_profile is darwin-only) ──
    ~/.aliases: packages/sh/aliases
    ~/.bashrc: packages/sh/bashrc
    ~/.zshrc: packages/sh/zshrc
    ~/.p10k.zsh: packages/sh/pk10.zsh
    ~/.profile: packages/sh/profile
    ~/.prettierrc: packages/sh/prettierrc

    # ── asdf / tool versions ───────────────────────────────
    ~/.asdfrc: packages/asdf/asdfrc
    ~/.default-gems: packages/asdf/default-gems
    ~/.default-npm-packages: packages/asdf/default-npm-packages

    # ── bat ────────────────────────────────────────────────
    ~/.bat.conf: packages/bat/bat.conf

    # ── bin scripts (cross-platform; clipcopy backs tmux/fzf copy binds) ──
    ~/.local/bin/clipcopy:
        create: true
        path: bin/clipcopy
    ~/.local/bin/lazygit-ai:
        create: true
        path: bin/lazygit-ai
    # AI prompt for lazygit commit commands (read by bin/lazygit-ai)
    ~/.config/lazygit-ai/prompt:
        create: true
        path: packages/lazygit/prompt

    # ── git ────────────────────────────────────────────────
    ~/.gitconfig: packages/git/gitconfig
    ~/.gitignore_global: packages/git/gitignore_global
    ~/.ignore: packages/git/ignore
    # fd reads this global ignore everywhere (rg reads ~/.ignore via .ripgreprc)
    ~/.fdignore: packages/git/ignore

    # ── gh (GitHub CLI; hosts.yml with tokens stays untracked) ──
    ~/.config/gh/config.yml:
        path: packages/gh/config.yml

    # ── ripgrep ────────────────────────────────────────────
    ~/.config/.ripgreprc:
        path: packages/ripgrep/.ripgreprc

    # ── atuin ──────────────────────────────────────────────
    ~/.config/atuin/config.toml:
        path: packages/atuin/config.toml

    # ── zsh-patina ─────────────────────────────────────────
    ~/.config/zsh-patina/config.toml:
        path: packages/zsh-patina/config.toml

    # ── lazygit (XDG fallback; the macOS real path is in darwin) ──
    ~/.config/lazygit/config.yml:
        path: packages/lazygit/config.yml

    ~/.config/delta/themes.gitconfig:
        path: packages/delta/themes.gitconfig

    # ── ruby (ctags / irb / pry / gems) ────────────────────
    ~/.ctags.d/global.ctags:
        path: packages/ruby/ctags
    ~/.irbrc: packages/ruby/irbrc
    ~/.pryrc: packages/ruby/pryrc
    ~/.gemrc: packages/ruby/gemrc
    ~/.rubocop.yml: packages/ruby/rubocop.yml

    # ── vscode (~/.config/Code/User is the path on BOTH macOS and Linux) ──
    ~/.config/Code/User/settings.json:
        path: packages/vscode/settings.json

    # ── opencode (AI agent; per-file/dir links — live dir also holds runtime
    #    state: .atl cache + node_modules stay real. opencode.json is NOT
    #    linked: it holds the local llama.cpp apiKey (gh hosts.yml pattern:
    #    secret file stays real and untracked)) ──
    ~/.config/opencode/tui.json:
        path: packages/opencode/tui.json
    ~/.config/opencode/AGENTS.md:
        path: packages/opencode/AGENTS.md
    ~/.config/opencode/AGENTS-advisor.md:
        path: packages/opencode/AGENTS-advisor.md
    ~/.config/opencode/AGENTS-orchestrator.md:
        path: packages/opencode/AGENTS-orchestrator.md
    ~/.config/opencode/.gentle-ai-default-agent.json:
        path: packages/opencode/.gentle-ai-default-agent.json
    ~/.config/opencode/package.json:
        path: packages/opencode/package.json
    ~/.config/opencode/agent:
        path: packages/opencode/agent
    ~/.config/opencode/commands:
        path: packages/opencode/commands
    ~/.config/opencode/plugins:
        path: packages/opencode/plugins
    ~/.config/opencode/skills:
        path: packages/opencode/skills
    # vendor/ (i-have-adhd plugin) intentionally untracked — lives only at ~/.config/opencode/vendor
    ~/.config/opencode/benchmarks:
        path: packages/opencode/benchmarks

    # ── oh-my-pi (config + prompts; agent/ DBs, logs and sessions stay real.
    #    plugins/installed_plugins.json is an auto-written registry — copied
    #    for reference, not linked) ──
    ~/.omp/marketplaces.json:
        path: packages/omp/marketplaces.json
    ~/.omp/agent/config.yml:
        path: packages/omp/agent/config.yml
    ~/.omp/agent/mcp.json:
        path: packages/omp/agent/mcp.json
    ~/.omp/agent/RULES.md:
        path: packages/omp/agent/RULES.md
    ~/.omp/agent/agents/sonic.md:
        path: packages/omp/agent/agents/sonic.md
    ~/.omp/agent/agents/advisor.md:
        path: packages/omp/agent/agents/advisor.md
    ~/.omp/agent/extensions/fff-preferred.ts:
        path: packages/omp/agent/extensions/fff-preferred.ts
    ~/.omp/plugins/package.json:
        path: packages/omp/plugins/package.json
