# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -sg escape-time 0
set -g allow-passthrough on

# increase scrollback buffer size
set -g history-limit 50000

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# refresh 'status-left' and 'status-right' more often
set -g status-interval 10

# FZF_COLORS / TMUX_FZF_OPTIONS are NOT set here. The tmux server keeps its own
# environment store, and update-environment can't carry these over: it reads the
# terminal's environment, which never had them (they are exported later, by the
# shell). .zshrc pushes both into the session (and -g) on every shell start, so
# the pickers and plain fzf share one set of values. See the fzf block in zshrc.

set-option -g  default-terminal   'tmux-256color'
set -as terminal-features ',tmux-256color:RGB'
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-overrides ',xterm*:sitm=\E[3m'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# clipboard settings
bind Enter copy-mode
setw -g mode-keys vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi y send -X copy-pipe "xsel -i --clipboard" \; send -X clear-selection
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "xsel -i --clipboard"
unbind   -T copy-mode MouseDragEnd1Pane
unbind   -T copy-mode-vi MouseDragEnd1Pane

# scrolling
bind-key -T copy-mode-vi WheelUpPane send -N2 -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send -N2 -X scroll-down

# focus events enabled for terminals that support them
set -g focus-events on

# super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# set behaviour as vim like editor
set -g @shell_mode 'vi'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# List of plugins
set -g @plugin 'carakan/tmux-onedark-theme'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'nhdaly/tmux-scroll-copy-mode'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'carakan/tmux-fzf'
set -g @plugin 'laktak/extrakto'
# extrakto binds @extrakto_key (default Tab) when it loads. Give it C-e here so
# the pane switcher keeps prefix+Tab for good: a manual bind-key only survives
# until the next TPM run, and extrakto's load-time bind then silently steals
# Tab. Setting the option also removes the need to hardcode its script path.
set -g @extrakto_key "C-e"

# tmux-fzf — manage sessions/windows/panes/commands/keybindings/clipboard/process with fzf
# Launch key for the picker (prefix+C-f). The plugin's main.tmux reads this
# from the tmux global environment, so it must be set BEFORE the TPM line at the
# bottom of this file — then the plugin binds the key itself on every reload.
set-environment -g TMUX_FZF_LAUNCH_KEY "C-f"
# Popup options are defined in .zshrc (TMUX_FZF_POPUP_FLAGS + FZF_COLORS) and
# pushed into the server environment from there, so there is one copy of the
# palette instead of one in this file and one in the shell.
set-environment -g TMUX_FZF_PANE_FORMAT "[#{window_name}:#{pane_current_command}] #{pane_current_path} [#{pane_width}x#{pane_height}] #{?pane_active,[active],[inactive]}#{?#{&&:#{pane_active},#{window_zoomed_flag}},[zoomed],}"
# MRU pane ordering (C-a Tab). 1 = most-recently-used first, 0 = stock index
# order. Toggle live: tmux set-environment -g TMUX_FZF_MRU 0|1
set-environment -g TMUX_FZF_MRU 1

# Customizations of theme
set -g @onedark_time_format "%I:%M %p"
set -g @onedark_widgets "#(prefix_highlight) #{battery_graph} #{battery_icon} #{battery_percentage} #{battery_remain}"
set -g @prefix_highlight_show_copy_mode 'on'

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes '"~rails server->rails server" "~rails s->rails s -p 3001 --binding=0.0.0.0" "~rake frontend:start->rake frontend:start"'
set -g @resurrect-save 'C-g'

bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi C-v ; bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
unbind-key -T copy-mode-vi Enter ; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
unbind-key -T copy-mode-vi y ; bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -n           S-PageUp   copy-mode -eu
bind-key -T copy-mode S-PageUp   send-keys -X page-up
bind-key -T copy-mode S-PageDown send-keys -X page-down

# don't rename windows automatically
set-option -g allow-rename off

# Initialize TMUX plugin manager. Post-plugin binds follow below — any config
# that must survive plugin (re)loading has to be set after this line.
run '~/.tmux/plugins/tpm/tpm'

# tmux-fzf key ownership — MUST come after the TPM line: every reload re-runs
# the plugins, and extrakto binds prefix+Tab at load time. Master config gives
# Tab to tmux-fzf (extrakto isn't in it), so extrakto moves to C-e here and
# nothing is lost. The picker's own launcher key (prefix+C-f) is bound by the
# plugin itself from TMUX_FZF_LAUNCH_KEY above, so it needs nothing here.
#
# Adaptive popups: TMUX_FZF_CLIENT_WIDTH and TMUX_FZF_CLIENT_HEIGHT are
# expanded against the client that pressed the key, so the same binding serves
# a desktop window and a phone over Termius. A client that is too narrow OR too
# short gets a near-fullscreen picker, no preview pane and inline info; others
# keep the layout from TMUX_FZF_OPTIONS. Thresholds: TMUX_FZF_COMPACT_WIDTH
# (default 140) and TMUX_FZF_COMPACT_HEIGHT (default 30).
#
# '#{TMUX_FZF_DIR}' resolves because the plugin's main.tmux put it in the global
# environment on load — this works whether the plugin lives under
# ~/.tmux/plugins or a custom TPM_PLUGIN_DIR.
bind-key Tab run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' TMUX_FZF_CLIENT_WIDTH='#{client_width}' TMUX_FZF_CLIENT_HEIGHT='#{client_height}' '#{TMUX_FZF_DIR}/scripts/pane.sh' switch"

set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix
set-option -g mouse on

# new section +++++++++++++++++++++++++++++++++++

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g window-style "fg=#d6d6d6,bg=#202020"
set -wg mode-style "bg=#003f72"
set -g window-active-style "fg=#FFFFFF,bg=#000000"
set -g pane-border-style "fg=#505050,bg=#202020"
set -g pane-active-border-style "fg=#808080,bg=#202020"