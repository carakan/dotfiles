# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -sg escape-time 0
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g extended-keys-format csi-u

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix
set-option -g mouse on

# increase scrollback buffer size
set -g history-limit 1000000

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# refresh 'status-left' and 'status-right' more often
set -g status-interval 10
set -g status-keys vi
set -g monitor-activity off
set -g monitor-bell on
set -g bell-action none
set -g visual-bell off
set -g status-position bottom

set -g default-terminal "tmux-256color"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'alacritty:extkeys'
set -as terminal-features 'xterm-256color:RGB:clipboard:usstyle:strikethrough:hyperlinks'
set -as terminal-features 'alacritty:RGB:clipboard:usstyle:strikethrough:hyperlinks:sync'
set -as terminal-features 'tmux-256color:RGB:clipboard:usstyle:strikethrough'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# clipboard settings
bind Enter copy-mode
set -g mode-keys vi

# Enable scrollbars and scrolling with mouse wheel
bind-key -T copy-mode-vi WheelUpPane send -N2 -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send -N2 -X scroll-down
set -g pane-scrollbars modal
set -g pane-scrollbars-style 'bg=#202020,fg=#323F4E'
set -g pane-scrollbars-position right

# focus events enabled for terminals that support them
set -g focus-events on
set -g cursor-style blinking-bar
set -g cursor-colour "#bfc7d4"

# super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# set behaviour as vim like editor
set -g @shell_mode 'vi'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\'  if-shell "$is_vim" 'send-keys C-\\'     'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# List of plugins
set -g @plugin 'carakan/tmux-onedark-theme'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'hyoretsu/tmux-persist'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'sainnhe/tmux-fzf'

# Customizations of theme
set -g @onedark_time_format "%I:%M %p"
set -g @onedark_widgets "#(prefix_highlight) #{battery_graph} #{battery_icon} #{battery_percentage} #{battery_remain}"
set -g @prefix_highlight_show_copy_mode 'on'

# tmux-persist — session save/restore (maintained fork of tmux-resurrect)
# Option prefix migrated @resurrect-* → @persist-* (old names still work as fallback).
set -g @persist-capture-pane-contents 'on'
set -g @persist-strategy-nvim 'session'
set -g @persist-processes '"~rails server->rails server" "~mix phx.server->mix phx.server" "~ember s" "~ember server" "~ember test --server"'
set -g @persist-save 'C-g'
# Preserve previous (tmux-resurrect) workflow: manual save/restore only.
# tmux-persist defaults to auto-save on detach/exit and auto-restore on session
# creation; disable both to match the old behavior.
set -g @persist-save-on-exit 'off'
set -g @persist-auto-restore 'off'


set -g @fingers-highlight-style 'fg=colour15,bg=colour234'
set -g @fingers-hint-style 'fg=colour39,bold,italics'
set -g @fingers-backdrop-style 'dim'
set -g @fingers-selected-highlight-style 'fg=cyan'
set -g @fingers-selected-hint-style 'fg=cyan,bold'

set -g @fuzzback-popup 1
set -g @fuzzback-fzf-colors 'bg+:#100E23,gutter:#323F4E,pointer:#F48FB1,info:#ffe6b3,hl:#F48FB1,hl+:#63f2f1'

# tmux-fzf — manage sessions/windows/panes/commands/keybindings/clipboard/process with fzf
# Launch picker: prefix + F (Shift+F). Defaults are pinned via set-environment
# because tmux.conf bare assignments don't propagate into run-shell env.
set-environment -g TMUX_FZF_LAUNCH_KEY "F"
# Popup options (tmux >= 3.2): centered, 62% × 38%, multi-select with Tab/Shift-Tab
set-environment -g TMUX_FZF_OPTIONS "-p -w 60% -h 55% -m"
bind-key "tab" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/pane.sh switch"

bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi C-v ; bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
unbind-key -T copy-mode-vi Enter ; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
unbind-key -T copy-mode-vi y ; bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -n           S-PageUp   copy-mode -eu
bind-key -T copy-mode S-PageUp   send-keys -X page-up
bind-key -T copy-mode S-PageDown send-keys -X page-down

# don't rename windows automatically
set-option -g allow-rename off
set -g set-titles on
set -g set-titles-string "#S:#I:#W"

set -g @fuzzback-popup-size '80%'

set -g popup-border-lines rounded
set -g popup-border-style "fg=#63f2f1,bg=#100E23"
set -g popup-style "bg=#1c1e23"
set -g menu-selected-style "bg=#003f72,fg=#FFFFFF,bold"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g prompt-history-limit 1000

# new section +++++++++++++++++++++++++++++++++++

# pain_control bindings (modernized) -----------------------------------------
# pane navigation (C-h/j/k/l handled by vim-tmux-navigator as no-prefix)
bind h   select-pane -L
bind j   select-pane -D
bind k   select-pane -U
bind l   select-pane -R

# window swap
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# pane splits (preserve current working directory)
bind |   split-window -h  -c "#{pane_current_path}"
bind \   split-window -fh -c "#{pane_current_path}"
bind -   split-window -v  -c "#{pane_current_path}"
bind _   split-window -fv -c "#{pane_current_path}"

# new window (preserve current working directory)
bind c   new-window       -c "#{pane_current_path}"

# pane management (modern additions)
bind R   respawn-pane     -k -c "#{pane_current_path}"
bind x   confirm-before   -p "kill pane #P? (y/n)" kill-pane
bind !   break-pane -d

# popups
# bind -N "scratch popup" g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
# bind -N "lazygit" G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

set -g window-style "fg=#d6d6d6,bg=#202020"
set -wg mode-style "bg=#003f72"
set -g window-active-style "fg=#FFFFFF,bg=#000000"
set -g pane-border-style "fg=#505050,bg=#202020"
set -g pane-active-border-style "fg=#808080,bg=#202020"
set -g pane-border-lines heavy
set -g pane-border-indicators colour
set -g pane-border-status off
