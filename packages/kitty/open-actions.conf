# open-actions.conf — what a mouse click on a detected URL opens.
#
# Pairs with the `detect_url_regex` entries in kitty.conf (kitty 0.49.2):
# those turn bare `path/to/file.ext:42` references in compiler and agent
# output into hoverable, clickable links. Without a rule here, clicking one
# would hand the string to the OS URL handler, which does nothing useful.
#
# Criteria are matched against the entire URL; processing stops at the first
# match, so the narrow file-reference rules come before everything else.
# Nothing below touches real http(s)/file URLs — those still fall through to
# open_url_with's default OS handler.

# Editor-style file:line references. The criterion uses Python regex syntax
# (unlike detect_url_regex, which is POSIX ERE) and must match the whole URL.
# The extension group mirrors the one in kitty.conf so the two stay in step:
# this is what stops host.example.com:8080 from being routed to nvim.
url ^[\w./~-]+\.(lua|md|py|js|ts|tsx|jsx|go|rs|c|cc|cpp|h|hpp|rb|sh|bash|zsh|conf|toml|yaml|yml|json|lock|vim):\d+$
action launch --type=background open-file-ref ${URL}

# Bare `path:line` with no extension is ambiguous with a host:port pair, so it
# is deliberately not matched here.
