# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -sg escape-time 0
# IMAGES: tmux has no native support for kitty's APC graphics protocol
# (`ESC _G ... ESC \`). It only understands sixel, and kitty has no sixel at
# all. The one working route is the passthrough envelope: the program wraps its
# escape sequence in `ESC P tmux; ... ESC \` (ESC bytes inside doubled) and tmux
# forwards it verbatim to the outer terminal. `allow-passthrough on` is what
# makes that possible; without it the sequences are silently dropped — which is
# why images "don't work in tmux" while the same command works outside.
#
# The programs that already do the wrapping for you:
#   chafa -f kitty --passthrough=tmux <img>     (chafa >= 1.14)
#   viu --tmux <img>                           (viu >= 0.5)
# Note `--passthrough=auto` is NOT enough: inside tmux chafa falls back to
# symbol art, so the format must be given explicitly.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# chafa picks kitty graphics over symbol art from these; without them the
# image silently degrades to coloured unicode blocks.
set -ga update-environment COLORTERM
set -ga update-environment KITTY_WINDOW_ID
set -ga update-environment KITTY_LISTEN_ON
set -ga update-environment KITTY_INSTALLATION_DIR
set -ga update-environment KITTY_PID
set -ga update-environment KITTY_SHELL_INTEGRATION
# propagate FZF_COLORS from the client shell into the server env so tmux-fzf
# (which runs in the server context) can theme its popups
set -ga update-environment FZF_COLORS
set -g extended-keys-format csi-u

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix
set-option -g mouse on

# increase scrollback buffer size
set -g history-limit 1000000

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# refresh 'status-left' and 'status-right' more often
set -g status-interval 10
set -g status-keys vi
# agentic monitoring: flag windows when a process (agent, build, server)
# produces output while you're elsewhere. Flag-only: no message, no focus
# steal — check the status line (onedark marks activity windows).
set -g monitor-activity on
set -g visual-activity off
set -g monitor-bell on
# `bell-action any` is what makes the alert-bell hook below fire, so it has to
# stay `any`. Measured on this machine: with `bell-action none` the hook is
# suppressed too, and the desktop notification never appears — so `none` is NOT
# a way to get "notification without bell". The forwarded BEL is harmless
# because kitty's enable_audio_bell is no (see packages/kitty/kitty.conf), so
# kitty neither sounds nor flashes; visual-bell off keeps tmux from drawing it
# in the pane either. The result is a visual-only notification.
set -g bell-action any
set -g visual-bell off
# Notification from the bell path ONLY for the prefix+M silence watchdog
# (window_silence_flag). Program bells — agents ringing on finish, builds —
# do NOT notify: they duplicated the contextual tmux-agent-done notification
# (audited 2026-10-07) and rang for every bell a CLI emits. Program bells stay
# visual: the onedark marker on the window tab. Script: bin/tmux-bell-notify.
set-hook -g alert-bell 'run-shell -b "$HOME/.local/bin/tmux-bell-notify" "#{window_name}"'
set -g status-position bottom

set -g default-terminal "tmux-256color"
set -s extended-keys on
# terminal-features — two entries only.
#
# 1. kitty-only: kitty keyboard protocol (extkeys), OSC 12 cursor-colour query
#    (ccolour), coloured/curly underlines (usstyle).
# 2. wildcard: the common modern set every other terminal gets — 24-bit colour
#    (RGB), OSC 52 clipboard, cursor style (DECSCUSR), strikethrough, overline,
#    OSC 8 hyperlinks, synchronized updates (no flicker on redraw), focus
#    reporting, window title, bracketed paste, DECSET left/right margins,
#    OSC 9;4 progress reporting, and utf8. `utf8` (3.8+) drives #{client_utf8}:
#    without it a client with no locale in its environment (Termius, for one)
#    reports 0 despite rendering UTF-8 fine. Note #{client_charset} does not
#    exist in any tmux version — it expands empty rather than erroring.
#    Unsupported features on older terminals are simply ignored.
#
# `sixel` is NOT here on purpose: kitty's binary has no sixel support at all
# (verified: strings the binary → 0 hits), so a wildcard would advertise sixel
# to kitty and tmux would emit sixel bytes kitty cannot render. kitty renders
# images through its own APC graphics protocol, which tmux cannot forward
# natively — see the passthrough note at the top of this file.
#
# Reset first so reloads replace instead of stacking (set -as appends).
set -sug terminal-features
set -as terminal-features 'xterm-kitty:extkeys:ccolour:usstyle'
set -as terminal-features '*:RGB:clipboard:cstyle:strikethrough:overline:hyperlinks:sync:focus:title:bpaste:margins:progressbar:utf8'
# nested tmux needs no entry: auto-detected via DA and gets a superset of these

# let applications inside tmux set the system clipboard via OSC 52
set -s set-clipboard on
# when the current session is destroyed, switch to another instead of detaching
set -g detach-on-destroy off
# no terminal-overrides needed: usstyle above already gives tmux the exact
# Smulx/Setulc undercurl sequences (plus Setulc1/ol); tmuxterm also injects
# them into the tmux-256color terminfo entry itself

# clipboard settings
bind Enter copy-mode
set -g mode-keys vi

# copy mode (3.7+): line numbers while selecting — relative to the cursor line,
# styled like the theme. Mouse-initiated copy mode still starts unnumbered.
set -g copy-mode-line-numbers relative
set -g copy-mode-line-number-style "fg=#aab2bf,bg=#282c34"
set -g copy-mode-current-line-number-style "fg=#98c379,bg=#282c34,bold"
# scroll-exit (3.7+): leave copy mode when selection reaches either edge, so
# scrolling a long output never leaves you stuck in copy mode.
bind -T copy-mode-vi Escape send-keys -X scroll-exit-on
bind -T copy-mode-vi q      send-keys -X scroll-exit-off
bind -T copy-mode-vi Q      send-keys -X scroll-exit-toggle
# recentre-top-bottom (3.7+): vi-style scroll repositioning in copy mode.
bind -T copy-mode-vi z      send-keys -X recentre-top-bottom
# 3.8 adds horizontal scrolling for wrapped lines, which matters here: a long
# agent/build log wraps, and there was previously no way to read the right-hand
# end of a wrapped line. $ / # walk to the logical start/end of a logical line.
bind -T copy-mode-vi Left   send-keys -X scroll-left
bind -T copy-mode-vi Right  send-keys -X scroll-right
bind -T copy-mode-vi h      send-keys -X scroll-left
bind -T copy-mode-vi l      send-keys -X scroll-right
bind -T copy-mode-vi $      send-keys -X goto-line-end
bind -T copy-mode-vi 0      send-keys -X goto-line-start
# half-page scroll, so a 1M-line buffer is navigable without holding a key
bind -T copy-mode-vi C-u    send-keys -X -N8 scroll-up
bind -T copy-mode-vi C-d    send-keys -X -N8 scroll-down
# style the line the cursor sits on (3.8): with copy-mode-line-numbers relative
# the number already moves; dimming the text itself makes it findable at a glance
set -g copy-mode-current-line-style "bg=#2c313c"

# Enable scrollbars and scrolling with mouse wheel
bind-key -T copy-mode-vi WheelUpPane send -N2 -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send -N2 -X scroll-down
# pane-scrollbars was off because the old `modal` mode narrows the pane by the
# scrollbar width and reflows the text (no margin escape hatch, scrollbar.c has
# no TTYC_MARGINS path). tmux 3.8 adds `auto-hide`, which fixes exactly that:
# the bar is an overlay, so pane_width stays constant while scrolling. Verified
# on this machine — pane_width 100 before, during and after a scroll under
# auto-hide, where modal would have narrowed it.
# Kitty's own scrollbar still covers plain kitty windows, so this only shows
# while you are actually scrolling inside tmux.
set -g pane-scrollbars auto-hide
set -g pane-scrollbars-position right
set -g pane-scrollbars-timeout 2000
set -g pane-scrollbars-style "fg=colour8,bg=colour23"

# focus events enabled for terminals that support them
set -g focus-events on

# super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# keep dead panes on screen until dismissed (3.7+): a crashed agent/build stays
# visible with its scrollback instead of vanishing. prefix+R clears it.
set -g remain-on-exit on
bind r set -g remain-on-exit off\; set -w remain-on-exit off\; display-message "remain-on-exit: off (pane exits close normally)"

# floating panes (3.7+): popups that behave like panes — same escape-sequence
# support, non-modal, moved/resized with the mouse. prefix+f floats the current
# pane.
#
# 3.8 notes:
#  - `move-pane -f` with no -s/-t now fails with "source and target panes must
#    be different": the current pane is taken as both ends. Floating is
#    therefore done with `break-pane -W`, which lifts the pane out of the tiled
#    layout. The old `bind f move-pane -f` therefore did nothing on 3.8.
#  - join-pane accepts a floating source, so prefix+F can tile a floater back.
#    3.7c could only float, never un-float. Both halves are in
#    bin/tmux-float-toggle because each needs a *different* pane as the other
#    end, which is the only real work involved.
bind f run-shell '~/.local/bin/tmux-float-toggle "#{pane_id}"'
bind F run-shell '~/.local/bin/tmux-float-toggle "#{pane_id}"'

# set behaviour as vim like editor
set -g @shell_mode 'vi'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\'  if-shell "$is_vim" 'send-keys C-\\'     'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# List of plugins
set -g @plugin 'carakan/tmux-onedark-theme'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'hyoretsu/tmux-persist'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'carakan/tmux-fzf'

# Customizations of theme
set -g @onedark_time_format "%I:%M %p"
set -g @onedark_widgets "#(prefix_highlight) #{battery_graph} #{battery_icon} #{battery_percentage} #{battery_remain}"
set -g @prefix_highlight_show_copy_mode 'on'

# tmux-persist — session save/restore (maintained fork of tmux-resurrect)
# Option prefix migrated @resurrect-* → @persist-* (old names still work as fallback).
set -g @persist-capture-pane-contents 'on'
set -g @persist-strategy-nvim 'session'
set -g @persist-processes '"~rails server->rails server" "~mix phx.server->mix phx.server" "~ember s" "~ember server" "~ember test --server"'
set -g @persist-save 'C-g'
# Preserve previous (tmux-resurrect) workflow: manual save/restore only.
# tmux-persist defaults to auto-save on detach/exit and auto-restore on session
# creation; disable both to match the old behavior.
set -g @persist-save-on-exit 'off'
set -g @persist-auto-restore 'off'
# Keep snapshots for 600 days — default 7 caused "not found" restores after
# gaps in manual saving (snapshots got pruned with no newer save in place).
set -g @persist-delete-backup-after '600'


set -g @fingers-highlight-style 'fg=colour15,bg=colour234'
set -g @fingers-hint-style 'fg=colour39,bold,italics'
set -g @fingers-backdrop-style 'dim'
set -g @fingers-selected-highlight-style 'fg=cyan'
set -g @fingers-selected-hint-style 'fg=cyan,bold'

set -g @fuzzback-popup 1
set -g @fuzzback-fzf-colors 'bg+:#100E23,gutter:#323F4E,pointer:#F48FB1,info:#ffe6b3,hl:#F48FB1,hl+:#63f2f1'
set -g @fuzzback-popup-size '80%'

# tmux-fzf — manage sessions/windows/panes/commands/keybindings/clipboard/process with fzf
# Launch picker: prefix + C-f (prefix+F stays with tmux-fingers' default).
# Pinned via set-environment because bare assignments don't propagate into run-shell env.
set-environment -g TMUX_FZF_LAUNCH_KEY "C-f"
# Popup options (tmux >= 3.3): centered, 60% x 60%, multi-select, reverse layout.
# tmux does NOT expand $ in set-environment, so '$FZF_COLORS' is stored literally
# and expanded by tmux-fzf's internal `eval` from the server env (FZF_COLORS is
# propagated from the client shell via update-environment above).
# NOTE: no quotes around $FZF_COLORS — tmux-fzf expands it via `eval`, and single
# quotes would suppress that expansion (leaving a literal --color=$FZF_COLORS,
# which fzf rejects -> blank popup). The value has no spaces, so it's safe unquoted.
set-environment -g TMUX_FZF_OPTIONS "-p -w 60% -h 60% -m --layout=reverse --color=\$FZF_COLORS --border=rounded --border-label=' fzf ' --border-label-pos=3 --separator='─' --preview-window=right:50%:wrap"
set-environment -g TMUX_FZF_PANE_FORMAT "[#{window_name}:#{pane_current_command}] #{pane_current_path} [#{pane_width}x#{pane_height}] #{?pane_active,[active],[inactive]}#{?#{&&:#{pane_active},#{window_zoomed_flag}},[zoomed],}"
bind-key "tab" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/pane.sh switch"

bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi C-v ; bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
unbind-key -T copy-mode-vi Enter ; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.local/bin/clipcopy"
unbind-key -T copy-mode-vi y ; bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.local/bin/clipcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.local/bin/clipcopy"

bind-key -n           S-PageUp   copy-mode -eu
bind-key -T copy-mode S-PageUp   send-keys -X page-up
bind-key -T copy-mode S-PageDown send-keys -X page-down

# don't rename windows automatically
set-option -g allow-rename off
set -g set-titles on
set -g set-titles-string "#S #T #W #{pane_current_command}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g prompt-history-limit 1000

# new section +++++++++++++++++++++++++++++++++++

# pain_control bindings (modernized) -----------------------------------------
# pane navigation (C-h/j/k/l handled by vim-tmux-navigator as no-prefix)
bind h   select-pane -L
bind j   select-pane -D
bind k   select-pane -U
bind l   select-pane -R

# window swap
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# pane splits (preserve current working directory)
#
# 3.8 repurposed split-window -f: it used to mean "floating", it now means
# "span the full window height/width". `split-window -f` still parses, so the
# old float splits silently produce *tiled* panes instead of floaters. Verified:
# `split-window -f` on a tiled pane gives two full-width tiled halves, and
# splitting inside an existing floater auto-creates a second floater.
#
# So prefix+\ and prefix+_ are now plain tiled splits, and float/tiled is the
# two-way toggle above (prefix+f / prefix+F).
bind |   split-window -h  -c "#{pane_current_path}"
bind -   split-window -v  -c "#{pane_current_path}"
bind \   split-window -h  -c "#{pane_current_path}"
bind _   split-window -v  -c "#{pane_current_path}"

# new window (preserve current working directory)
bind c   new-window       -c "#{pane_current_path}"

# pane management (modern additions)
bind R   respawn-pane     -k -c "#{pane_current_path}"
bind x   confirm-before   -p "kill pane #P? (y/n)" kill-pane
bind !   break-pane -d

# agentic-work helpers -------------------------------------------------------
# M: silence watchdog — raises this window's bell flag if it goes quiet for 10
# minutes (long agent task finished/stalled while you work elsewhere).
# Per-window. With bell-action none this produces the desktop notification via
# the alert-bell hook and nothing else: no BEL to kitty, no visual bell.
bind M if-shell -F '#{window_silence_flag}' \
  'set -w monitor-silence 0 ; display-message "silence watchdog: off"' \
  'set -w monitor-silence 600 ; display-message "silence watchdog: 10m"'
# T / Y: pane title bar on/off — identify which agent/command runs in which
# pane when running several side by side. Format is harmless while off.
set -g pane-border-format " #{pane_index}: #{pane_current_command} [#{pane_current_path}]#{?window_zoomed_flag, [zoom],}"
bind T set -w pane-border-status top
bind Y set -w pane-border-status off

# popups
# bind -N "scratch popup" g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
# bind -N "lazygit" G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# ============================================================================
# >>> 3.8 agentic enhancements — DELETE THIS WHOLE SECTION IF PROBLEMATIC <<<
# Requires the HEAD server (brew install --HEAD tmux → next-3.9).
# On the old 3.7c server these lines error harmlessly at load.
# Verified on a throwaway HEAD server: monitors, filters, refresh bindings.
# ============================================================================

# Long-command finisher: desktop notification when a command running in a
# background pane (agent, build, test suite) finishes after @agentic-notify-secs.
# Implementation: tmux 3.8 monitor hooks (`set-hook -B`, via
# bin/tmux-agent-monitors) watch pane_current_command every second; busy →
# store start time + command, idle → run bin/tmux-agent-done which notifies.
# Interactive apps (nvim/ssh/less/…) are skip-listed in the start monitor.
# Monitors are client-scoped and need a live session, so they are registered
# on every attach — not at config-parse time.
set -g @agentic-notify-secs 30
set-hook -g client-attached 'run-shell -b "$HOME/.dotfiles/bin/tmux-agent-monitors"'

# X: kill every other pane in the window, sparing the current one — sweep
# finished agent panes without closing your editor pane. -a is 3.8+ filtered.
bind X confirm-before -p "kill all other panes? (y/n)" "kill-pane -a"

# Copy mode: refresh-toggle — watch a streaming agent log from inside copy
# mode (3.8 refresh-on/off/toggle). r stays refresh-now; R toggles live mode.
bind -T copy-mode-vi R send-keys -X refresh-toggle

# Attach does not wipe the screen: pre-attach content scrolls into tmux
# scrollback (3.8 clear-on-attach) — reattach and read what agents printed
# while you were away instead of losing it to the alternate screen.
set -s clear-on-attach off

# <<< end 3.8 agentic section >>>
