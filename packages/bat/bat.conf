# Set the theme to "TwoDark"
--theme="1337"

# Git modifications and file header, but NO line numbers. Line numbers are
# wrong for a `cat` replacement: they shift every line right and turn piped
# output into something you cannot copy cleanly. Use `bat -n` when you want them.
--style="changes"
--color=always

# Use italic text on the terminal (not supported on all terminals)
--italic-text=always

# Use "gitignore" highlighting for ".ignore" files
--map-syntax ".ignore:Git Ignore"
--map-syntax mkd:md
--map-syntax .zshrc:bash
--map-syntax vimrc:vim
--map-syntax scss:css
--map-syntax slim:haml
--map-syntax vue:jsx
--map-syntax .dockerignore:.gitignore

--tabs=2